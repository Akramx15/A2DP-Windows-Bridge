[workspace]
resolver = "3"
members = [
    "crates/btstack-sys",
    "crates/ldac-sys",
    "crates/openaptx-sys",
    "crates/fdkaac-sys",
    "crates/lhdcv5-sys",
    "crates/win-sys",
    "crates/hci-transport",
    "crates/codec",
    "crates/audio-capture",
    "crates/bt-host",
    "crates/pipeline",
    "crates/core",
    "crates/ipc",
    "apps/core-service",
    "apps/driver-helper",
    "apps/ui/src-tauri",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/SeiyaFunaokaJP/A2DP-Windows-Bridge"

[workspace.dependencies]
btstack-sys = { path = "crates/btstack-sys" }
hci-transport = { path = "crates/hci-transport" }
codec = { path = "crates/codec" }
bt-host = { path = "crates/bt-host" }
pipeline = { path = "crates/pipeline" }
a2dpwb-core = { path = "crates/core" }
win-sys = { path = "crates/win-sys" }
audio-capture = { path = "crates/audio-capture" }
ipc = { path = "crates/ipc" }

cc = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-channel = "0.5"
rtrb = "0.3"
arc-swap = "1.7"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 4
